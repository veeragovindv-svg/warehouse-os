  <style>
    /* ── Critical Glassmorphism Layout ───────────────────── */
    .top-bar {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: var(--sp-4);
    }
    .top-bar-breadcrumb { min-width: 0; }
    .top-bar-actions {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
    }

    .main-area {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    .content-area {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: var(--sp-6);
      scrollbar-width: thin;
      scrollbar-color: rgba(6, 182, 212, 0.3) transparent;
    }
    #page-content {
      max-width: 1560px;
      margin: 0 auto;
      animation: glass-page-enter 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes glass-page-enter {
      from { opacity: 0; transform: translateY(8px) scale(0.995); filter: blur(2px); }
      to   { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    .alert-bell { position: relative; }
    .alert-badge {
      position: absolute;
      top: -2px; right: -2px;
      min-width: 17px; height: 17px;
      background: var(--clr-danger);
      color: #FFFFFF;
      font-size: 9px;
      font-weight: 800;
      font-family: var(--font-mono);
      border-radius: 9999px;
      border: 1.5px solid var(--clr-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
      animation: badge-pulse-glass 2s infinite;
    }
    @keyframes badge-pulse-glass {
      0%, 100% { transform: scale(1); box-shadow: 0 0 8px rgba(239, 68, 68, 0.5); }
      50%      { transform: scale(1.1); box-shadow: 0 0 16px rgba(239, 68, 68, 0.85); }
    }

    .page-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 50vh;
      gap: var(--sp-4);
      color: var(--clr-text-secondary);
      font-family: var(--font-sans);
      font-size: var(--text-sm);
    }

    .spinner {
      width: 36px; height: 36px;
      border: 2px solid rgba(6, 182, 212, 0.15);
      border-top-color: var(--clr-primary-light);
      border-right-color: var(--clr-accent);
      border-radius: 50%;
      box-shadow: 0 0 16px rgba(6, 182, 212, 0.35);
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .user-avatar {
      width: 34px; height: 34px;
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.25), rgba(139, 92, 246, 0.25));
      color: var(--clr-primary-light);
      border: 1px solid rgba(6, 182, 212, 0.4);
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      font-family: var(--font-mono);
      cursor: pointer;
      transition: all var(--dur-fast);
    }
    .user-avatar:hover {
      border-color: var(--clr-primary-light);
      box-shadow: 0 0 18px rgba(6, 182, 212, 0.45);
      transform: translateY(-1px);
    }

    /* Theme Switcher Toggle Button */
    .theme-toggle-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: var(--radius-full);
      background: var(--glass-bg-subtle);
      border: var(--glass-border);
      color: var(--clr-text);
      cursor: pointer;
      transition: all var(--dur-fast);
    }
    .theme-toggle-btn:hover {
      background: var(--glass-bg-hover);
      border-color: var(--glass-border-bright);
      color: var(--clr-primary-light);
      transform: rotate(15deg);
    }

    .mobile-only { display: none; }
    @media (max-width: 768px) {
      .mobile-only { display: flex; }
      .sidebar { position: fixed; left: -100%; transition: left 0.3s cubic-bezier(0.16, 1, 0.3, 1); z-index: 200; }
      .sidebar.open { left: 0; }
    }

  <!-- ─── DYNAMIC THEME & GLASSMORPHISM INTERACTIONS ──── -->
  <script>
  // Theme Switcher Management
  const themeToggleBtn = document.getElementById('theme-toggle-btn');
  const sunIcon = document.getElementById('theme-icon-sun');
  const moonIcon = document.getElementById('theme-icon-moon');

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('warehouseos_theme', theme);
    if (theme === 'light') {
      sunIcon.classList.remove('hidden');
      moonIcon.classList.add('hidden');
      themeToggleBtn.setAttribute('title', 'Switch to Dark Screen');
    } else {
      sunIcon.classList.add('hidden');
      moonIcon.classList.remove('hidden');
      themeToggleBtn.setAttribute('title', 'Switch to Light Screen');
    }
  }

  // Load saved theme or default to dark
  const savedTheme = localStorage.getItem('warehouseos_theme') || 'dark';
  applyTheme(savedTheme);

  themeToggleBtn?.addEventListener('click', () => {
    const currentTheme = document.documentElement.getAttribute('data-theme');
    const newTheme = currentTheme === 'light' ? 'dark' : 'light';
    applyTheme(newTheme);
    if (window.Utils?.Toast) {
      window.Utils.Toast.info(`Switched to ${newTheme.toUpperCase()} SCREEN mode`, '', 2000);
    }
  });

  // Button ripple effect
  document.addEventListener('click', function(e) {
    const btn = e.target.closest('.btn');
    if (!btn || btn.disabled) return;
    const rect = btn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height) * 1.2;
    const x = e.clientX - rect.left - size / 2;
    const y = e.clientY - rect.top  - size / 2;
    const ripple = document.createElement('span');
    ripple.className = 'btn-ripple';
    ripple.style.cssText = `width:${size}px;height:${size}px;left:${x}px;top:${y}px;`;
    btn.appendChild(ripple);
    setTimeout(() => ripple.remove(), 550);
  });

  // KPI card 3D perspective tilt
  document.addEventListener('mousemove', function(e) {
    document.querySelectorAll('.kpi-card').forEach(card => {
      const rect = card.getBoundingClientRect();
      const cx = rect.left + rect.width  / 2;
      const cy = rect.top  + rect.height / 2;
      const dx = (e.clientX - cx) / (rect.width  / 2);
      const dy = (e.clientY - cy) / (rect.height / 2);
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 1.8) {
        card.style.transform = `translateY(-4px) rotateX(${-dy*3.5}deg) rotateY(${dx*3.5}deg)`;
      } else {
        card.style.transform = '';
      }
    });
  });

  // Reset tilt on mouse leave
  document.querySelector('.content-area')?.addEventListener('mouseleave', () => {
    document.querySelectorAll('.kpi-card').forEach(card => card.style.transform = '');
  });

  // Animated number count-up for KPI values
  function animateCounter(el) {
    const text = el.textContent.trim();
    const match = text.match(/^([^\d]*)([\d,\.]+)(.*)$/);
    if (!match) return;
    const [, prefix, numStr, suffix] = match;
    const target = parseFloat(numStr.replace(/,/g, ''));
    if (isNaN(target) || target === 0) return;
    let start = null;
    const duration = 750;
    function step(ts) {
      if (!start) start = ts;
      const progress = Math.min((ts - start) / duration, 1);
      const ease = 1 - Math.pow(1 - progress, 3);
      const current = Math.round(ease * target);
      el.textContent = prefix + current.toLocaleString() + suffix;
      if (progress < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  // MutationObserver for newly rendered KPI elements
  const kpiObserver = new MutationObserver(mutations => {
    mutations.forEach(m => m.addedNodes.forEach(node => {
      if (node.nodeType !== 1) return;
      node.querySelectorAll?.('.kpi-value').forEach(animateCounter);
    }));
  });
  const contentEl = document.getElementById('page-content');
  if (contentEl) kpiObserver.observe(contentEl, { childList: true, subtree: true });
  </script>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Cyan/Violet Gradients for Isometric Box -->
    <linearGradient id="top-face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    
    <linearGradient id="left-face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    
    <linearGradient id="right-face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Glass Rounded Square Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-grad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="8" />

  <!-- Outer Glowing Circuit Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(6, 182, 212, 0.25)" stroke-width="4" stroke-dasharray="16 12" />

  <!-- 3D Isometric Warehouse Box (Glowing Spatial Logo) -->
  <g filter="url(#neon-glow)" transform="translate(256, 256)">
    <!-- Top Face -->
    <polygon points="0,-120 120,-50 0,20 -120,-50" fill="url(#top-face)" opacity="0.95" />
    
    <!-- Left Face -->
    <polygon points="-120,-50 0,20 0,140 -120,70" fill="url(#left-face)" opacity="0.9" />
    
    <!-- Right Face -->
    <polygon points="0,20 120,-50 120,70 0,140" fill="url(#right-face)" opacity="0.95" />

    <!-- Isometric Inner Wireframe Laser Lines -->
    <line x1="0" y1="-120" x2="0" y2="20" stroke="#FFFFFF" stroke-width="4" opacity="0.6" />
    <line x1="-120" y1="-50" x2="0" y2="20" stroke="#FFFFFF" stroke-width="4" opacity="0.4" />
    <line x1="120" y1="-50" x2="0" y2="20" stroke="#FFFFFF" stroke-width="4" opacity="0.4" />
    <line x1="0" y1="20" x2="0" y2="140" stroke="#FFFFFF" stroke-width="5" opacity="0.8" />

    <!-- Central Neural Node Spark -->
    <circle cx="0" cy="20" r="14" fill="#FFFFFF" />
    <circle cx="0" cy="20" r="26" fill="none" stroke="#22D3EE" stroke-width="4" />
  </g>
</svg>
